<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 120" width="290" height="120" role="img" aria-label="SohojERP - ব্যবসা হবে আরও সহজ" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="o" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="270" y2="0">
      <stop offset="0" stop-color="#f57c00"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="270" y2="0">
      <stop offset="0" stop-color="#00695c"/>
      <stop offset="0.55" stop-color="#26a69a"/>
      <stop offset="1" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- নাম: Sohoj গাঢ় নেভি, ERP কমলা-সোনালি গ্রেডিয়েন্ট -->
  <text x="10" y="62" textLength="260" lengthAdjust="spacingAndGlyphs" font-family="'Segoe UI','Hind Siliguri',Arial,sans-serif" font-size="58" font-weight="800" fill="#0d2b45">Sohoj<tspan fill="url(#o)">ERP</tspan></text>
  <!-- নামের নিচে বাঁকা সুইশ: টিল থেকে কমলা, শেষে একটা বিন্দু -->
  <path d="M12 76 Q140 92 262 72" fill="none" stroke="url(#s)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="272" cy="70" r="5" fill="#f57c00"/>
  <!-- স্লোগান: নামের সমান দৈর্ঘ্য (260) -->
  <text x="10" y="108" textLength="260" lengthAdjust="spacingAndGlyphs" font-family="'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nirmala UI','Vrinda',sans-serif" font-size="26" font-weight="600" fill="#546e7a">ব্যবসা হবে আরও সহজ</text>
</svg>
